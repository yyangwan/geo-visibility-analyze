version: "3.8"

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_USER: aiscope
      MYSQL_PASSWORD: aiscope
      MYSQL_DATABASE: aiscope
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      AISCOPE_DATABASE_URL: mysql+aiomysql://aiscope:aiscope@mysql:3306/aiscope
      AISCOPE_DEEPSEEK_API_KEY: ${AISCOPE_DEEPSEEK_API_KEY:-}
      AISCOPE_QWEN_API_KEY: ${AISCOPE_QWEN_API_KEY:-}
      AISCOPE_DOUBAO_API_KEY: ${AISCOPE_DOUBAO_API_KEY:-}
      AISCOPE_KIMI_API_KEY: ${AISCOPE_KIMI_API_KEY:-}
      AISCOPE_WENXIN_API_KEY: ${AISCOPE_WENXIN_API_KEY:-}
      AISCOPE_HUNYUAN_API_KEY: ${AISCOPE_HUNYUAN_API_KEY:-}
      # Optional: override LLM used for prompt generation and suggestions
      AISCOPE_LLM_API_KEY: ${AISCOPE_LLM_API_KEY:-}
      AISCOPE_LLM_BASE_URL: ${AISCOPE_LLM_BASE_URL:-}
      AISCOPE_LLM_MODEL: ${AISCOPE_LLM_MODEL:-}
      # Product website visibility analysis
      AISCOPE_PRODUCT_WEBSITE_CRAWLER_PROVIDER: ${AISCOPE_PRODUCT_WEBSITE_CRAWLER_PROVIDER:-native}
      AISCOPE_PRODUCT_WEBSITE_CRAWLER_TIMEOUT_SECONDS: ${AISCOPE_PRODUCT_WEBSITE_CRAWLER_TIMEOUT_SECONDS:-30}
      AISCOPE_FIRECRAWL_API_KEY: ${AISCOPE_FIRECRAWL_API_KEY:-}
      AISCOPE_FIRECRAWL_BASE_URL: ${AISCOPE_FIRECRAWL_BASE_URL:-https://api.firecrawl.dev}
      AISCOPE_FIRECRAWL_WAIT_FOR_MS: ${AISCOPE_FIRECRAWL_WAIT_FOR_MS:-1000}
      AISCOPE_FIRECRAWL_MAX_AGE_MS: ${AISCOPE_FIRECRAWL_MAX_AGE_MS:-172800000}
      AISCOPE_PRODUCT_WEBSITE_AI_CITATION_ENABLED: ${AISCOPE_PRODUCT_WEBSITE_AI_CITATION_ENABLED:-false}
      AISCOPE_PRODUCT_WEBSITE_AI_CITATION_PLATFORMS: ${AISCOPE_PRODUCT_WEBSITE_AI_CITATION_PLATFORMS:-deepseek,doubao,hunyuan,qwen,kimi}
      AISCOPE_PRODUCT_WEBSITE_AI_CITATION_PROMPT_LIMIT: ${AISCOPE_PRODUCT_WEBSITE_AI_CITATION_PROMPT_LIMIT:-2}
      # Auth
      AISCOPE_SECRET_KEY: ${AISCOPE_SECRET_KEY:?AISCOPE_SECRET_KEY must be set}
      AISCOPE_GENILINK_JWKS_URL: ${AISCOPE_GENILINK_JWKS_URL:-http://host.docker.internal:3001/.well-known/jwks.json}
      AISCOPE_GENILINK_ISSUER: ${AISCOPE_GENILINK_ISSUER:-https://app.genilink.cn}
      AISCOPE_GENILINK_AUDIENCE: ${AISCOPE_GENILINK_AUDIENCE:-visibility.genilink.cn}
      # CORS (comma-separated origins, default: allow all)
      AISCOPE_CORS_ORIGINS: ${AISCOPE_CORS_ORIGINS:-*}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - ./backend:/app
    # Dev override: use --reload for hot-reloading
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  mysql-data:
