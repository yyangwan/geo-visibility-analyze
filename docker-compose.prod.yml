# Production overlay — use with: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
version: "3.8"

services:
  backend:
    # Override: no volume mount, no --reload (Dockerfile default is production mode)
    volumes: []
    command: []
    restart: unless-stopped
    environment:
      AISCOPE_DEVICE_GATEWAY_TOKEN: ${AISCOPE_DEVICE_GATEWAY_TOKEN:?AISCOPE_DEVICE_GATEWAY_TOKEN must be set}
      AISCOPE_DEVICE_GATEWAY_IDS: ${AISCOPE_DEVICE_GATEWAY_IDS:-CHAO}
      AISCOPE_DEVICE_GATEWAY_LEASE_SECONDS: ${AISCOPE_DEVICE_GATEWAY_LEASE_SECONDS:-120}
      AISCOPE_MOBILE_APP_CAPTURE_ENABLED: ${AISCOPE_MOBILE_APP_CAPTURE_ENABLED:-true}
      AISCOPE_MOBILE_APP_CAPTURE_GATEWAY_ID: ${AISCOPE_MOBILE_APP_CAPTURE_GATEWAY_ID:-CHAO}

  frontend:
    volumes: []
    restart: unless-stopped

  nginx:
    restart: unless-stopped
